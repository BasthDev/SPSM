services:
  web:
    image: nginx:alpine
    container_name: spsm-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - /home/basth/spsm-app/web_app_app/dist:/usr/share/nginx/html:ro
    networks:
      - spsm_ui

  pbui:
    image: nginx:alpine
    container_name: spsm-pbui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./pbui.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - spsm_ui

networks:
  spsm_ui:
    driver: bridge
