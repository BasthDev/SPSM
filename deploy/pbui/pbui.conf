# PocketBase UI reverse proxy — clean URL (tanpa /_/#/)
# - /api/*  -> PocketBase API (termasuk /api/realtime SSE)
# - /_/     -> PocketBase admin UI asli (tetap bisa diakses langsung)
# - /assets/, /libs/ -> asset UI PB (di-resolve relatif dari URL bersih)
# - /*      -> serve HTML UI PB + inject script path->hash
server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # --- PocketBase API (SSE realtime butuh buffering off + timeout panjang) ---
    location /api/ {
        proxy_pass http://host.docker.internal:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Admin UI asli tetap bisa diakses via /_/ ---
    location /_/ {
        proxy_pass http://host.docker.internal:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Asset UI PB (referensi relatif ./assets/ ./libs/ dari URL bersih) ---
    location /assets/ {
        proxy_pass http://host.docker.internal:8090/_/assets/;
        proxy_set_header Host $host;
    }
    location /libs/ {
        proxy_pass http://host.docker.internal:8090/_/libs/;
    }

    # --- Semua path lain: serve UI PB + konversi path -> hash route ---
    location / {
        rewrite ^ /_/ break;
        proxy_pass http://host.docker.internal:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</body>' '<script>(function(){try{if(!location.hash){var p=location.pathname==="\/"?"\/":location.pathname;location.hash="#"+p+location.search;}}catch(e){}})();</script></body>';
    }
}
